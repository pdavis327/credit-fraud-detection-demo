# FeatureStore instance for the credit card fraud demo.
# Training data: upload feast/data/transactions.parquet to MinIO (see feast/README.md).
#
#   oc apply -n credit-card-fraud -f openshift/feast-instance.yaml
---
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: credit-fraud-feast
  labels:
    feature-store-ui: enabled
spec:
  feastProject: credit_fraud
  feastProjectDir:
    git:
      url: https://github.com/pdavis327/credit-fraud-detection-demo
      ref: main
      featureRepoPath: feast
      envFrom:
        - secretRef:
            name: shared-s3
  services:
    registry:
      local:
        server:
          restAPI: true
          envFrom:
            - secretRef:
                name: shared-s3
    onlineStore:
      server:
        envFrom:
          - secretRef:
              name: shared-s3
